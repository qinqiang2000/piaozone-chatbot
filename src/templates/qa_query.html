<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智齿 QA 查询</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div id="app" class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">智齿 QA 查询</h1>
        <div class="mb-4">
            <label class="block mb-2">开始日期：</label>
            <input type="date" v-model="startDate" class="border p-2">
        </div>
        <div class="mb-4">
            <label class="block mb-2">结束日期：</label>
            <input type="date" v-model="endDate" class="border p-2">
        </div>
        <button @click="queryQA" class="bg-blue-500 text-white px-4 py-2 rounded">查询</button>
        <button @click="exportExcel" class="bg-green-500 text-white px-4 py-2 rounded ml-2">导出 Excel</button>
        
        <div v-if="qas.length" class="mt-4">
            <table class="w-full border-collapse border">
                <thead>
                    <tr>
                        <th class="border p-2">会话id</th>
                        <th class="border p-2">消息id</th>
						<th class="border p-2">问题</th>
                        <th class="border p-2">回答</th>
                        <th class="border p-2">创建时间</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="qa in qas" :key="qa.id" class="border">
                        <td class="border p-2">[[ qa.session_id ]]</td>
						<td class="border p-2">[[ qa.msg_id ]]</td>
						<td class="border p-2">[[ qa.question ]]</td>
                        <td class="border p-2">[[ qa.answer ]]</td>
                        <td class="border p-2">[[ qa.created_at ]]</td>
                    </tr>
                </tbody>
            </table>
            <div class="mt-4">
                <button @click="prevPage" :disabled="currentPage === 1" class="bg-gray-300 px-4 py-2 rounded">上一页</button>
                <span class="mx-4">第 [[ currentPage ]] 页，共 [[ totalPages ]] 页</span>
                <button @click="nextPage" :disabled="currentPage === totalPages" class="bg-gray-300 px-4 py-2 rounded">下一页</button>
            </div>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            delimiters: ['[[', ']]'],
            data: {
                startDate: '{{ today }}',
                endDate: '{{ today }}',
                qas: [],
                currentPage: 1,
                totalPages: 1,
                perPage: 50
            },
            methods: {
                async queryQA() {
                    try {
                        const response = await axios.get('/zhichi/qa/query', {
                            params: {
                                start_date: this.startDate,
                                end_date: this.endDate,
                                page: this.currentPage,
                                per_page: this.perPage
                            }
                        });
                        this.qas = response.data.data;
                        this.totalPages = response.data.total_pages;
                    } catch (error) {
                        console.error('Error fetching QA data:', error);
                        alert('获取数据时出错');
                    }
                },
                async exportExcel() {
                    try {
                        const response = await axios.get('/zhichi/qa/export', {
                            params: {
                                start_date: this.startDate,
                                end_date: this.endDate
                            },
                            responseType: 'blob'
                        });
                        const url = window.URL.createObjectURL(new Blob([response.data]));
                        const link = document.createElement('a');
                        link.href = url;
                        link.setAttribute('download', `QA_${this.startDate}_${this.endDate}.xlsx`);
                        document.body.appendChild(link);
                        link.click();
                    } catch (error) {
                        console.error('Error exporting Excel:', error);
                        alert('导出 Excel 时出错');
                    }
                },
                prevPage() {
                    if (this.currentPage > 1) {
                        this.currentPage--;
                        this.queryQA();
                    }
                },
                nextPage() {
                    if (this.currentPage < this.totalPages) {
                        this.currentPage++;
                        this.queryQA();
                    }
                }
            }
        });
    </script>
</body>
</html>
