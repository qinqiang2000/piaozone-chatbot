<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QA 查询</title>
    <script src="/static/axios.min.js"></script>
    <script src="/static/vue.js"></script>
    <link href="/static/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
    <div id="app" class="container mx-auto p-4">
        <h1 class="text-2xl font-bold mb-4">{{ appname }} QA 查询</h1>
        <div class="mb-4">
            <label class="block mb-2">开始日期：</label>
            <input type="date" v-model="startDate" class="border p-2">
        </div>
        <div class="mb-4">
            <label class="block mb-2">结束日期：</label>
            <input type="date" v-model="endDate" class="border p-2">
        </div>
		<div class="mb-4">
            <label class="block mb-2 font-bold">筛选条件：</label>
            <label class="block">
                <input type="radio" v-model="filterType" value="liked"> 只显示点赞
            </label>
            <label class="block">
                <input type="radio" v-model="filterType" value="disliked"> 只显示点踩
            </label>
            <label class="block">
                <input type="radio" v-model="filterType" value="feedback"> 只显示已反馈
            </label>
            <label class="block">
                <input type="radio" v-model="filterType" value="unfeedback"> 只显示未反馈
            </label>
            <label class="block">
                <input type="radio" v-model="filterType" value="all" checked> 显示全部
            </label>
        </div>
        <button @click="queryQA" class="bg-blue-500 text-white px-4 py-2 rounded">查询</button>
        <button @click="exportExcel" class="bg-green-500 text-white px-4 py-2 rounded ml-2">导出 Excel</button>
        
        <div v-if="tableData.length" class="mt-4">
            <table class="w-full border-collapse border">
				<thead>
					<tr>
						<th v-for="zhheader in zhTableHeaders" :key="zhheader" class="border p-2">
							[[ zhheader ]]
						</th>
					</tr>
				</thead>
				<tbody>
					<tr v-for="row in tableData" :key="row.id" class="border">
						<td v-for="header in tableHeaders" :key="header" class="border p-2">
							[[ row[header] ]]  <!-- 显示对应的值 -->
						</td>
					</tr>
				</tbody>
            </table>
            <div class="mt-4">
                <button @click="prevPage" :disabled="currentPage === 1" class="bg-gray-300 px-4 py-2 rounded">上一页</button>
                <span class="mx-4">第 [[ currentPage ]] 页，共 [[ totalPages ]] 页</span>
                <button @click="nextPage" :disabled="currentPage === totalPages" class="bg-gray-300 px-4 py-2 rounded">下一页</button>
            </div>
        </div>
        <div v-else class="mt-4 text-gray-600">
            暂无数据
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            delimiters: ['[[', ']]'],
            data: {
                appname: '{{ appname }}',
                appType: '{{ apptype }}',
                startDate: '{{ today }}',
                endDate: '{{ today }}',
                tableHeaders: {{ tableHeaders | tojson | safe }},
				zhTableHeaders: {{ zhTableHeaders | tojson | safe }},
                tableData: [],
                currentPage: 1,
                totalPages: 1,
                perPage: 50,
                filterType: 'all'
            },
            created() {
                // 初始加载数据
                this.queryQA();
            },
            methods: {
                async queryQA() {
                    try {
                        const response = await axios.get(`/${this.appType}/qa/query`, {
                            params: {
                                start_date: this.startDate,
                                end_date: this.endDate,
                                page: this.currentPage,
                                per_page: this.perPage,
								feedback: this.filterType
                            }
                        });
                        this.tableData = response.data.data;
                        this.totalPages = response.data.total_pages;
                        
                        // 如果返回的数据为空，重置页码到第一页
                        if (this.tableData.length === 0) {
                            this.currentPage = 1;
                        }
                    } catch (error) {
                        console.error('Error fetching QA data:', error);
                        alert('获取数据时出错');
                    }
                },
                async exportExcel() {
                    try {
                        const response = await axios.get(`/${this.appType}/qa/export`, {
                            params: {
                                start_date: this.startDate,
                                end_date: this.endDate,
								feedback: this.filterType
                            },
                            responseType: 'blob'
                        });
                        const url = window.URL.createObjectURL(new Blob([response.data]));
                        const link = document.createElement('a');
                        link.href = url;
                        // 改进导出文件名的生成
                        const filename = `QA_${this.appType}_${this.startDate}_${this.endDate}_${this.filterType}.xlsx`;
                        link.setAttribute('download', filename);
                        document.body.appendChild(link);
                        link.click();
                        link.remove(); // 清理创建的链接
                    } catch (error) {
                        console.error('Error exporting Excel:', error);
                        alert('导出 Excel 时出错');
                    }
                },
                prevPage() {
                    if (this.currentPage > 1) {
                        this.currentPage--;
                        this.queryQA();
                    }
                },
                nextPage() {
                    if (this.currentPage < this.totalPages) {
                        this.currentPage++;
                        this.queryQA();
                    }
                }
            }
        });
    </script>
</body>
</html>
